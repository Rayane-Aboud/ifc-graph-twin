[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wires ingest + store + api together: `ingest` and `serve`."

[[bin]]
name = "twin"
path = "src/main.rs"

[dependencies]
twin-core = { workspace = true }
twin-ingest-ifc4 = { workspace = true }
twin-store-neo4j = { workspace = true }
twin-api = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
# Forward to the store's Bolt path so `twin ingest --execute` can hit a live
# Neo4j. Off by default keeps the binary offline and network-free.
bolt = ["twin-store-neo4j/bolt"]
# Convenience: turn on both optional backends at once.
full = ["bolt", "twin-ingest-ifc4/real-parser"]
